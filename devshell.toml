[devshell]
name = "my-rust-project"

[[env]]
name = "CARGO_HOME"
eval = "${CARGO_HOME:-$HOME/.cargo}"

[[env]]
name = "PATH"
prefix = "${CARGO_HOME}/bin"

[[commands]]
name = "install-local"
help = "Install the local octa release binary into Cargo's bin directory (extra args are passed to cargo install)"
command = '''
cargo install "$@" --path "$PRJ_ROOT" --locked --force
'''
