[package]
name = "octa-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Local Issue collaboration for developers and AI agents"
license = "MIT"
repository = "https://github.com/choplin/octa"
readme = "README.md"
include = [
    "/.sqlx/**",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/README.md",
    "/docs/**",
    "/migrations/**",
    "/scripts/**",
    "/skills/octa/**",
    "/src/**",
    "/tests/**",
]

[[bin]]
name = "octa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-graphql = { version = "7", default-features = false }
clap = { version = "4", features = ["derive", "string"] }
crossterm = "0.28"
fastrand = "2"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["rt", "macros"] }
urushi = "0.1.0"

[dev-dependencies]
tempfile = "3"

[profile.dist]
inherits = "release"
lto = "thin"
